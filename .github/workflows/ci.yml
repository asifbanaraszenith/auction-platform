name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and create lockfile
        run: npm install

      - name: Commit generated package-lock.json
        if: github.event_name == 'push'
        run: |
          git add package-lock.json
          if git diff --cached --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add npm lockfile for App Hosting"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push --force-with-lease "origin" "HEAD:${GITHUB_REF_NAME}"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.log

      - name: Report lint failure
        if: failure()
        run: |
          if [ -f lint-output.log ]; then
            summary=$(tail -n 40 lint-output.log | tr '\n' ' ' | cut -c1-1800)
            echo "::error title=Lint failed::$summary"
          fi

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log

      - name: Report production build failure
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            summary=$(tail -n 25 build-output.log | tr '\n' ' ' | cut -c1-1800)
            echo "::error title=Production build failed::$summary"
          fi
