name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Automated QA tests
        run: npm test

      - name: Lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.log

      - name: Report lint failure
        if: failure()
        run: |
          if [ -f lint-output.log ]; then
            summary=$(tail -n 40 lint-output.log | tr '\n' ' ' | cut -c1-1800)
            echo "::error title=Lint failed::$summary"
          fi

      - name: Production build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log

      - name: Report production build failure
        if: failure()
        run: |
          if [ -f build-output.log ]; then
            summary=$(tail -n 25 build-output.log | tr '\n' ' ' | cut -c1-1800)
            echo "::error title=Production build failed::$summary"
          fi

  browser-e2e:
    name: Browser E2E
    needs: validate
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Run browser E2E
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
