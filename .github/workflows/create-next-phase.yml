name: Create Next Phase Branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-next-phase:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'phase-')
    runs-on: ubuntu-latest
    steps:
      - name: Determine and create next phase branch
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.payload.pull_request.head.ref;
            const match = head.match(/^phase-(\d{2})-(.+)$/);
            if (!match) {
              core.setFailed(`Unexpected phase branch name: ${head}`);
              return;
            }

            const current = Number(match[1]);
            const next = current + 1;
            const phases = {
              2: 'authentication',
              3: 'auction-management',
              4: 'participants',
              5: 'teams-bidders',
              6: 'auction-engine',
              7: 'live-bidding',
              8: 'purse-squad-validation',
              9: 'administration',
              10: 'testing-security',
              11: 'deployment'
            };

            const suffix = phases[next];
            if (!suffix) {
              core.info(`Phase ${current} is the final configured phase. No new branch will be created.`);
              return;
            }

            const branch = `phase-${String(next).padStart(2, '0')}-${suffix}`;
            const sha = context.payload.pull_request.merge_commit_sha;
            if (!sha) {
              core.setFailed('Merge commit SHA is unavailable; refusing to create a branch from an unknown baseline.');
              return;
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`${branch} already exists; no action taken.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha
            });

            core.info(`Created ${branch} from merged main commit ${sha}.`);
